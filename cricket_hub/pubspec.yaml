name: cricket_hub
description: CricketHub - Local cricket management & live scoring platform (Phase 1 MVP).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (backend)
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_messaging: ^16.7.0

  # Google Sign-In
  google_sign_in: ^7.2.0

  # State management (beginner-friendly, as decided)
  provider: ^6.1.2

  # Network status (offline banner on scoring screen)
  connectivity_plus: ^7.3.1

  # Formatting (dates, overs like "15.2")
  intl: ^0.20.3

  # Nice icons for cricket app
  cupertino_icons: ^2.0.0
  qr_flutter: ^4.1.0
  cached_network_image: ^4.0.4
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/player_hero.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
